<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>devBuddy Master Sequence Diagram</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'JetBrains Mono', monospace; background: #020617; min-height: 100vh; padding: 2rem; color: white; }
    .container { max-width: 1200px; margin: 0 auto; }
    .header { margin-bottom: 2rem; }
    .header-row { display: flex; align-items: center; gap: 1rem; margin-bottom: 0.5rem; }
    .pulse-dot { width: 12px; height: 12px; background: #22d3ee; border-radius: 50%; animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.025em; }
    .subtitle { color: #94a3b8; font-size: 0.875rem; margin-left: 1.75rem; }
    .diagram-container { background: rgba(15, 23, 42, 0.5); border-radius: 1rem; border: 1px solid #1e293b; padding: 1.5rem; overflow-x: auto; }
    svg { width: 100%; min-width: 1000px; display: block; }
    .footer { text-align: center; margin-top: 1.5rem; color: #475569; font-size: 0.75rem; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-row">
        <div class="pulse-dot"></div>
        <h1>devBuddy Master Sequence Diagram</h1>
      </div>
      <p class="subtitle">Adaptive Learning: Curiosity-Driven Path Modification</p>
    </div>

    <div class="diagram-container">
      <svg viewBox="0 0 1000 1400">
        <defs>
          <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" />
          </marker>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
          </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#grid)" />

        <!-- Lifelines -->
        <rect x="50" y="50" width="120" height="40" rx="6" fill="rgba(30, 41, 59, 0.5)" stroke="#94a3b8" stroke-width="1.5"/>
        <text x="110" y="75" fill="white" font-size="12" font-weight="600" text-anchor="middle">User (Aki)</text>
        <line x1="110" y1="90" x2="110" y2="1350" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,5"/>

        <rect x="230" y="50" width="120" height="40" rx="6" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1.5"/>
        <text x="290" y="75" fill="white" font-size="12" font-weight="600" text-anchor="middle">Frontend</text>
        <line x1="290" y1="90" x2="290" y2="1350" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,5"/>

        <rect x="410" y="50" width="120" height="40" rx="6" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
        <text x="470" y="75" fill="white" font-size="12" font-weight="600" text-anchor="middle">Backend API</text>
        <line x1="470" y1="90" x2="470" y2="1350" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,5"/>

        <rect x="590" y="50" width="120" height="40" rx="6" fill="rgba(167, 139, 250, 0.4)" stroke="#a78bfa" stroke-width="1.5"/>
        <text x="650" y="75" fill="white" font-size="12" font-weight="600" text-anchor="middle">Orchestrator</text>
        <line x1="650" y1="90" x2="650" y2="1350" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,5"/>

        <rect x="770" y="50" width="120" height="40" rx="6" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
        <text x="830" y="75" fill="white" font-size="12" font-weight="600" text-anchor="middle">AI Agents</text>
        <line x1="830" y1="90" x2="830" y2="1350" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,5"/>

        <rect x="910" y="50" width="80" height="40" rx="6" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1.5"/>
        <text x="950" y="75" fill="white" font-size="10" font-weight="600" text-anchor="middle">Vector DB</text>
        <line x1="950" y1="90" x2="950" y2="1350" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,5"/>

        <!-- PHASE 1: SUBJECT SELECTION -->
        <text x="50" y="120" fill="#fbbf24" font-size="14" font-weight="700">Phase 1: Subject Selection</text>
        <line x1="110" y1="140" x2="288" y2="140" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <text x="200" y="135" fill="#fde68a" font-size="10" text-anchor="middle">Select Subject</text>
        <line x1="290" y1="160" x2="468" y2="160" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <line x1="470" y1="180" x2="648" y2="180" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <line x1="650" y1="200" x2="828" y2="200" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <text x="740" y="195" fill="#94a3b8" font-size="10" text-anchor="middle">Assessment Agent: Gen 10 Qs</text>
        <line x1="830" y1="220" x2="652" y2="220" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <line x1="650" y1="240" x2="472" y2="240" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <line x1="470" y1="260" x2="292" y2="260" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <line x1="290" y1="280" x2="112" y2="280" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <text x="200" y="275" fill="#fde68a" font-size="10" text-anchor="middle">Render Assessment UI</text>

        <!-- PHASE 2: ASSESSMENT & PROFILING -->
        <text x="50" y="320" fill="#22d3ee" font-size="14" font-weight="700">Phase 2: Assessment & Profiling</text>
        <line x1="110" y1="340" x2="288" y2="340" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <text x="200" y="335" fill="#94a3b8" font-size="10" text-anchor="middle">Submit Answers</text>
        <line x1="290" y1="360" x2="468" y2="360" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <line x1="470" y1="380" x2="648" y2="380" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <line x1="650" y1="400" x2="828" y2="400" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <text x="740" y="395" fill="#94a3b8" font-size="10" text-anchor="middle">Score & Profile User</text>
        <line x1="830" y1="420" x2="652" y2="420" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <text x="740" y="435" fill="#94a3b8" font-size="10" text-anchor="middle">User Level: Intermediate</text>

        <!-- PHASE 3: FULL AGENTIC ORCHESTRATION (THE BRAIN) -->
        <rect x="40" y="460" width="920" height="650" rx="12" fill="rgba(167, 139, 250, 0.05)" stroke="#a78bfa" stroke-width="1" stroke-dasharray="8,4"/>
        <text x="50" y="480" fill="#a78bfa" font-size="14" font-weight="700">Phase 3: Full Agentic Orchestration Loop</text>
        
        <line x1="650" y1="510" x2="828" y2="510" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <text x="740" y="505" fill="#94a3b8" font-size="10" text-anchor="middle">1. Planner Agent: Gen Curriculum</text>
        <line x1="830" y1="530" x2="652" y2="530" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        
        <line x1="650" y1="570" x2="828" y2="570" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <text x="740" y="565" fill="#94a3b8" font-size="10" text-anchor="middle">2. Analysis Agent: Validate Path</text>
        <line x1="830" y1="590" x2="652" y2="590" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        
        <line x1="650" y1="630" x2="828" y2="630" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <text x="740" y="625" fill="#94a3b8" font-size="10" text-anchor="middle">3. Design Agent: Craft Content</text>
        <line x1="830" y1="650" x2="652" y2="650" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        
        <line x1="650" y1="700" x2="828" y2="700" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <text x="740" y="695" fill="#94a3b8" font-size="10" text-anchor="middle">4. Checker Agent: Fact-Check</text>
        <line x1="830" y1="720" x2="948" y2="720" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <line x1="950" y1="740" x2="832" y2="740" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <line x1="830" y1="780" x2="652" y2="780" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <text x="740" y="795" fill="#94a3b8" font-size="10" text-anchor="middle">Fact-Checked Final Lesson</text>

        <!-- CURIOSITY LOOP (THE NEW MAGIC) -->
        <line x1="110" y1="960" x2="288" y2="960" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <text x="200" y="955" fill="#fb7185" font-size="10" text-anchor="middle">Ask Deep Question / Curiosity</text>
        <line x1="290" y1="980" x2="468" y2="980" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <line x1="470" y1="1000" x2="648" y2="1000" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        
        <line x1="650" y1="1040" x2="828" y2="1040" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <text x="740" y="1035" fill="#94a3b8" font-size="10" text-anchor="middle">Analysis: Deep-Dive Detected?</text>
        <line x1="830" y1="1060" x2="652" y2="1060" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <text x="740" y="1075" fill="#94a3b8" font-size="10" text-anchor="middle">Trigger: Path Modification</text>
        
        <line x1="650" y1="1100" x2="828" y2="1100" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <text x="740" y="1095" fill="#94a3b8" font-size="10" text-anchor="middle">Planner: Inject Side-Quest/Module</text>
        <line x1="830" y1="1120" x2="652" y2="1120" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <text x="740" y="1135" fill="#94a3b8" font-size="10" text-anchor="middle">Updated Personalized Path</text>

        <!-- PHASE 4: DELIVERY -->
        <text x="50" y="1220" fill="#34d399" font-size="14" font-weight="700">Phase 4: Final Delivery</text>
        <line x1="650" y1="1250" x2="472" y2="1250" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <line x1="470" y1="1270" x2="292" y2="1270" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <line x1="290" y1="1290" x2="112" y2="1290" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <text x="200" y="1285" fill="#94a3b8" font-size="10" text-anchor="middle">Render Path & Lesson</text>

        <!-- Legend -->
        <text x="50" y="1320" fill="white" font-size="10" font-weight="600">Legend</text>
        <line x1="50" y1="1335" x2="65" y2="1335" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <text x="70" y="1338" fill="#94a3b8" font-size="8">Subject Selection</text>
        <line x1="170" y1="1335" x2="185" y2="1335" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <text x="190" y="1338" fill="#94a3b8" font-size="8">Assessment/Delivery</text>
        <line x1="290" y1="1335" x2="305" y2="1335" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <text x="310" y="1338" fill="#94a3b8" font-size="8">Agent Logic</text>
        <line x1="410" y1="1335" x2="425" y2="1335" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <text x="430" y="1338" fill="#fb7185" font-size="8">Curiosity Loop (Path Modification)</text>
      </svg>
    </div>
    <p class="footer">devBuddy • Master Sequence Diagram • v1.3 (Adaptive Learning Enabled)</p>
  </div>
</body>
</html>
