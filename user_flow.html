<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>devBuddy User Flow Diagram</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'JetBrains Mono', monospace; background: #020617; min-height: 100vh; padding: 2rem; color: white; }
    .container { max-width: 1200px; margin: 0 auto; }
    .header { margin-bottom: 2rem; }
    .header-row { display: flex; align-items: center; gap: 1rem; margin-bottom: 0.5rem; }
    .pulse-dot { width: 12px; height: 12px; background: #22d3ee; border-radius: 50%; animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.025em; }
    .subtitle { color: #94a3b8; font-size: 0.875rem; margin-left: 1.75rem; }
    .diagram-container { background: rgba(15, 23, 42, 0.5); border-radius: 1rem; border: 1px solid #1e293b; padding: 1.5rem; overflow-x: auto; }
    svg { width: 100%; min-width: 900px; display: block; }
    .footer { text-align: center; margin-top: 1.5rem; color: #475569; font-size: 0.75rem; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-row">
        <div class="pulse-dot"></div>
        <h1>devBuddy User Journey / Use Case</h1>
      </div>
      <p class="subtitle">v1.2: Adaptive Learning & Curiosity Loop</p>
    </div>

    <div class="diagram-container">
      <svg viewBox="0 0 1000 600">
        <defs>
          <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" />
          </marker>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
          </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#grid)" />

        <!-- User Actor -->
        <circle cx="100" cy="300" r="40" fill="rgba(30, 41, 59, 0.5)" stroke="#94a3b8" stroke-width="2"/>
        <text x="100" y="305" fill="white" font-size="14" font-weight="600" text-anchor="middle">STUDENT</text>
        <text x="100" y="355" fill="#94a3b8" font-size="10" text-anchor="middle">(Aki)</text>

        <!-- System Boundary -->
        <rect x="250" y="50" width="650" height="500" rx="12" fill="rgba(34, 211, 238, 0.02)" stroke="#22d3ee" stroke-width="1" stroke-dasharray="8,4"/>
        <text x="262" y="70" fill="#22d3ee" font-size="12" font-weight="600">devBuddy System Boundary</text>

        <!-- Use Cases -->
        <ellipse cx="450" cy="100" rx="100" ry="40" fill="rgba(251, 191, 36, 0.3)" stroke="#fbbf24" stroke-width="2"/>
        <text x="450" y="95" fill="white" font-size="11" font-weight="600" text-anchor="middle">Select Subject</text>
        <text x="450" y="110" fill="#fde68a" font-size="9" text-anchor="middle">(Choose Language/Topic)</text>

        <ellipse cx="450" cy="200" rx="100" ry="40" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1.5"/>
        <text x="450" y="195" fill="white" font-size="11" font-weight="600" text-anchor="middle">Take Assessment</text>
        <text x="450" y="210" fill="#94a3b8" font-size="9" text-anchor="middle">(10-Question baseline)</text>

        <ellipse cx="450" cy="300" rx="100" ry="40" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1.5"/>
        <text x="450" y="295" fill="white" font-size="11" font-weight="600" text-anchor="middle">Explore Personal Path</text>
        <text x="450" y="310" fill="#94a3b8" font-size="9" text-anchor="middle">(Dynamic Curriculum)</text>

        <ellipse cx="450" cy="400" rx="100" ry="40" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1.5"/>
        <text x="450" y="395" fill="white" font-size="11" font-weight="600" text-anchor="middle">Engage with Lesson</text>
        <text x="450" y="410" fill="#94a3b8" font-size="9" text-anchor="middle">(Code & Animations)</text>

        <ellipse cx="450" cy="500" rx="100" ry="40" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1.5"/>
        <text x="450" y="495" fill="white" font-size="11" font-weight="600" text-anchor="middle">Ask AI Teacher</text>
        <text x="450" y="510" fill="#94a3b8" font-size="9" text-anchor="middle">(Real-time Clarification)</text>

        <!-- CURIOUSITY LOOP (NEW) -->
        <path d="M 550 500 Q 600 450 600 300" fill="none" stroke="#fb7185" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
        <text x="610" y="400" fill="#fb7185" font-size="10" font-weight="600">Curiosity Trigger: Update Path</text>

        <!-- Connections User to Use Cases -->
        <line x1="140" y1="300" x2="350" y2="110" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <line x1="450" y1="140" x2="450" y2="160" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <line x1="140" y1="300" x2="350" y2="210" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <line x1="140" y1="300" x2="350" y2="310" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <line x1="140" y1="300" x2="350" y2="410" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <line x1="140" y1="300" x2="350" y2="510" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>

        <!-- AI Agents as Secondary Actor (Right Side) -->
        <rect x="780" y="250" width="100" height="100" rx="8" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="2"/>
        <text x="830" y="295" fill="white" font-size="12" font-weight="600" text-anchor="middle">AI Agent</text>
        <text x="830" y="310" fill="#94a3b8" font-size="9" text-anchor="middle">Orchestrator</text>

        <!-- Use Cases to Agents -->
        <line x1="550" y1="110" x2="780" y2="280" stroke="#34d399" stroke-width="1" stroke-dasharray="4,4" marker-end="url(#arrowhead)"/>
        <line x1="550" y1="210" x2="780" y2="300" stroke="#34d399" stroke-width="1" stroke-dasharray="4,4" marker-end="url(#arrowhead)"/>
        <line x1="550" y1="310" x2="780" y2="320" stroke="#34d399" stroke-width="1" stroke-dasharray="4,4" marker-end="url(#arrowhead)"/>
        <line x1="550" y1="410" x2="780" y2="340" stroke="#34d399" stroke-width="1" stroke-dasharray="4,4" marker-end="url(#arrowhead)"/>
        <line x1="550" y1="510" x2="780" y2="360" stroke="#34d399" stroke-width="1" stroke-dasharray="4,4" marker-end="url(#arrowhead)"/>

        <!-- Legend -->
        <text x="50" y="50" fill="white" font-size="10" font-weight="600">Legend</text>
        <ellipse cx="60" cy="65" rx="15" ry="8" fill="rgba(251, 191, 36, 0.3)" stroke="#fbbf24" stroke-width="1"/>
        <text x="80" y="68" fill="#94a3b8" font-size="8">Entry Point</text>
        <ellipse cx="60" cy="80" rx="15" ry="8" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1"/>
        <text x="80" y="83" fill="#94a3b8" font-size="8">Use Case</text>
        <line x1="50" y1="95" x2="65" y2="95" stroke="#64748b" stroke-width="1" marker-end="url(#arrowhead)"/>
        <text x="70" y="98" fill="#94a3b8" font-size="8">User Interaction</text>
        <line x1="50" y1="110" x2="65" y2="110" stroke="#34d399" stroke-width="1" stroke-dasharray="4,4" marker-end="url(#arrowhead)"/>
        <text x="70" y="113" fill="#94a3b8" font-size="8">AI Orchestration</text>
        <line x1="50" y1="125" x2="65" y2="125" stroke="#fb7185" stroke-width="1" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
        <text x="70" y="128" fill="#fb7185" font-size="8">Curiosity Loop</text>
      </svg>
    </div>
    <p class="footer">devBuddy • User Case Diagram • v1.2 (Adaptive Learning)</p>
  </div>
</body>
</html>
