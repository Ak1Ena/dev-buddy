<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>devBuddy Sequence Diagram</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'JetBrains Mono', monospace; background: #020617; min-height: 100vh; padding: 2rem; color: white; }
    .container { max-width: 1200px; margin: 0 auto; }
    .header { margin-bottom: 2rem; }
    .header-row { display: flex; align-items: center; gap: 1rem; margin-bottom: 0.5rem; }
    .pulse-dot { width: 12px; height: 12px; background: #22d3ee; border-radius: 50%; animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.025em; }
    .subtitle { color: #94a3b8; font-size: 0.875rem; margin-left: 1.75rem; }
    .diagram-container { background: rgba(15, 23, 42, 0.5); border-radius: 1rem; border: 1px solid #1e293b; padding: 1.5rem; overflow-x: auto; }
    svg { width: 100%; min-width: 1000px; display: block; }
    .footer { text-align: center; margin-top: 1.5rem; color: #475569; font-size: 0.75rem; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-row">
        <div class="pulse-dot"></div>
        <h1>devBuddy Sequence Diagram</h1>
      </div>
      <p class="subtitle">Flow: Subject Selection & Ability Assessment</p>
    </div>

    <div class="diagram-container">
      <svg viewBox="0 0 1000 900">
        <defs>
          <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" />
          </marker>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
          </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#grid)" />

        <!-- Lifelines -->
        <rect x="50" y="50" width="120" height="40" rx="6" fill="rgba(30, 41, 59, 0.5)" stroke="#94a3b8" stroke-width="1.5"/>
        <text x="110" y="75" fill="white" font-size="12" font-weight="600" text-anchor="middle">User (Aki)</text>
        <line x1="110" y1="90" x2="110" y2="850" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,5"/>

        <rect x="230" y="50" width="120" height="40" rx="6" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1.5"/>
        <text x="290" y="75" fill="white" font-size="12" font-weight="600" text-anchor="middle">Frontend</text>
        <line x1="290" y1="90" x2="290" y2="850" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,5"/>

        <rect x="410" y="50" width="120" height="40" rx="6" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
        <text x="470" y="75" fill="white" font-size="12" font-weight="600" text-anchor="middle">Backend API</text>
        <line x1="470" y1="90" x2="470" y2="850" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,5"/>

        <rect x="590" y="50" width="120" height="40" rx="6" fill="rgba(167, 139, 250, 0.4)" stroke="#a78bfa" stroke-width="1.5"/>
        <text x="650" y="75" fill="white" font-size="12" font-weight="600" text-anchor="middle">Orchestrator</text>
        <line x1="650" y1="90" x2="650" y2="850" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,5"/>

        <rect x="770" y="50" width="120" height="40" rx="6" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
        <text x="830" y="75" fill="white" font-size="12" font-weight="600" text-anchor="middle">AI Agents</text>
        <line x1="830" y1="90" x2="830" y2="850" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,5"/>

        <rect x="910" y="50" width="80" height="40" rx="6" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1.5"/>
        <text x="950" y="75" fill="white" font-size="10" font-weight="600" text-anchor="middle">Vector DB</text>
        <line x1="950" y1="90" x2="950" y2="850" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,5"/>

        <!-- Flow 1: Subject Selection -->
        <line x1="110" y1="130" x2="288" y2="130" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <text x="200" y="125" fill="#fde68a" font-size="10" text-anchor="middle">Select Subject (e.g. Python)</text>
        <line x1="290" y1="150" x2="468" y2="150" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <text x="380" y="145" fill="#fde68a" font-size="10" text-anchor="middle">POST /setup-assessment</text>
        <line x1="470" y1="170" x2="648" y2="170" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <text x="560" y="165" fill="#fde68a" font-size="10" text-anchor="middle">get_assessment_questions(subject)</text>

        <!-- Flow 2: Dynamic Assessment Generation -->
        <line x1="650" y1="210" x2="828" y2="210" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <text x="740" y="205" fill="#94a3b8" font-size="10" text-anchor="middle">Assessment Agent: Gen 10 Qs</text>
        <line x1="830" y1="230" x2="652" y2="230" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <text x="740" y="245" fill="#94a3b8" font-size="10" text-anchor="middle">Assessment JSON (10 Qs)</text>
        <line x1="650" y1="270" x2="472" y2="270" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <line x1="470" y1="290" x2="292" y2="290" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <line x1="290" y1="310" x2="112" y2="310" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <text x="200" y="305" fill="#fde68a" font-size="10" text-anchor="middle">Render Assessment UI</text>

        <!-- Flow 3: Answering & Scoring -->
        <line x1="110" y1="350" x2="288" y2="350" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <text x="200" y="345" fill="#94a3b8" font-size="10" text-anchor="middle">Submit Answers</text>
        <line x1="290" y1="370" x2="468" y2="370" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <line x1="470" y1="390" x2="648" y2="390" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <line x1="650" y1="430" x2="828" y2="430" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <text x="740" y="425" fill="#94a3b8" font-size="10" text-anchor="middle">Score & Profile User</text>
        <line x1="830" y1="450" x2="652" y2="450" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <text x="740" y="465" fill="#94a3b8" font-size="10" text-anchor="middle">User Level (Beginner/Int/Adv)</text>

        <!-- Flow 4: Learning Path Generation (Original Flow) -->
        <line x1="650" y1="500" x2="828" y2="500" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <text x="740" y="495" fill="#94a3b8" font-size="10" text-anchor="middle">Planner: Gen Path based on Level</text>
        <line x1="830" y1="520" x2="652" y2="520" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <text x="740" y="535" fill="#94a3b8" font-size="10" text-anchor="middle">Personalized Path</text>
        <line x1="650" y1="560" x2="472" y2="560" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <line x1="470" y1="580" x2="292" y2="580" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <line x1="290" y1="600" x2="112" y2="600" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <text x="200" y="595" fill="#94a3b8" font-size="10" text-anchor="middle">Render Learning Path</text>

        <!-- Legend -->
        <text x="50" y="820" fill="white" font-size="10" font-weight="600">Legend</text>
        <line x1="50" y1="835" x2="65" y2="835" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <text x="70" y="838" fill="#94a3b8" font-size="8">Subject Selection Flow</text>
        <line x1="170" y1="835" x2="185" y2="835" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <text x="190" y="838" fill="#94a3b8" font-size="8">Assessment Flow</text>
        <line x1="290" y1="835" x2="305" y2="835" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <text x="310" y="838" fill="#94a3b8" font-size="8">AI Agent Logic</text>
      </svg>
    </div>
    <p class="footer">devBuddy • Sequence Diagram • v1.1 (Updated)</p>
  </div>
</body>
</html>
